@if (open()) {
  <div class="modal-backdrop fade show"></div>
  <div
    class="modal fade show d-block"
    tabindex="-1"
    role="dialog"
    [attr.id]="idPrefix() + '-modal'"
    aria-modal="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" [attr.id]="idPrefix() + '-modal-title'">New workspace</h5>
          <button
            type="button"
            class="btn-close"
            [attr.id]="idPrefix() + '-modal-close'"
            (click)="close()"></button>
        </div>
        <div class="modal-body d-flex flex-column gap-3">
          @if (error()) {
            <div class="alert alert-danger mb-0" [attr.id]="idPrefix() + '-error'">{{ error() }}</div>
          }
          <div class="form-floating">
            <input
              [attr.id]="idPrefix() + '-name'"
              class="form-control"
              placeholder="Name"
              [ngModel]="name()"
              (ngModelChange)="name.set($event)" />
            <label [attr.for]="idPrefix() + '-name'">Name</label>
          </div>
          <div class="form-floating">
            <input
              [attr.id]="idPrefix() + '-description'"
              class="form-control"
              placeholder="Description"
              [ngModel]="description()"
              (ngModelChange)="description.set($event)" />
            <label [attr.for]="idPrefix() + '-description'">Description</label>
          </div>
          <div class="form-floating">
            <select
              [attr.id]="idPrefix() + '-visibility'"
              class="form-select"
              [ngModel]="visibility()"
              (ngModelChange)="visibility.set($event)">
              <option value="PRIVATE">Private</option>
              <option value="PUBLIC">Public</option>
            </select>
            <label [attr.for]="idPrefix() + '-visibility'">Visibility</label>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            [attr.id]="idPrefix() + '-cancel'"
            (click)="close()">
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-primary"
            [attr.id]="idPrefix() + '-button'"
            [disabled]="saving() || !name().trim()"
            (click)="submit()">
            @if (saving()) {
              <span class="spinner-border spinner-border-sm me-1" role="status"></span>
            }
            Create
          </button>
        </div>
      </div>
    </div>
  </div>
}
